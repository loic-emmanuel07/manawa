<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redline — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-card">

  <div class="login-header">
    <div class="login-logo">
      <svg width="24" height="24" viewBox="0 0 100 100">
        <line x1="22" y1="78" x2="78" y2="22" stroke="#FAECE7" stroke-width="9" stroke-linecap="round"/>
        <circle cx="22" cy="78" r="9" fill="#FAECE7"/>
        <circle cx="78" cy="22" r="9" fill="#FAECE7"/>
      </svg>
    </div>
    <p class="login-title">Content de te revoir</p>
    <p class="login-subtitle">Connecte-toi pour continuer</p>
  </div>

  <button class="btn-google" type="button">
    <svg width="16" height="16" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l3-2.33z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
    </svg>
    Continuer avec Google
  </button>

  <button class="btn-apple" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M16.71 12.13c.02 2.44 2.14 3.25 2.16 3.26-.02.06-.34 1.15-1.11 2.28-.67.98-1.37 1.96-2.47 1.98-1.08.02-1.43-.64-2.67-.64-1.24 0-1.62.62-2.64.64-1.06.02-1.86-1.06-2.53-2.04-1.37-1.98-2.41-5.59-1.01-8.03.7-1.22 1.62-1.99 2.76-2.01 1.08-.02 2.1.73 2.67.73.56 0 1.61-.9 2.72-.76.46.02 1.78.19 2.62 1.42-.07.04-1.57.92-1.55 2.66Zm-1.84-7.08c.57-.69 1-1.65 1-2.62-.01-.09-.01-.18-.03-.28-.95.04-2.08.63-2.76 1.41-.54.63-1.02 1.63-1.02 2.57 0 .11 0 .22.02.32.07.01.16.01.25.01.88 0 1.78-.6 2.54-1.41Z" fill="currentColor"/>
    </svg>
    Continuer avec Apple
  </button>
  <div class="divider"><span>ou</span></div>

  <form>
    <div class="form-group">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
    </div>

    <div class="forgot-password">
      <a href="#">Mot de passe oublié ?</a>
    </div>

    <button class="btn-primary" type="submit">Se connecter</button>
  </form>

  <p class="signup-link">Pas encore de compte ? <a href="#">S'inscrire</a></p>

</div>

</body>
</html>
